version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - forbidigo
    - gocritic
    - misspell
    - noctx
    - revive
    - unconvert
    - wastedassign

  settings:
    forbidigo:
      # context.TODO() must not exist in production code, and neither must the
      # three sources of non-determinism that would make golden files unstable.
      # They are injected instead: Clock, IDGen, Rand.
      forbid:
        - pattern: ^context\.TODO$
          msg: "context.TODO is not allowed in production code; take a ctx parameter"
        - pattern: ^time\.Now$
          msg: "inject a Clock instead of calling time.Now directly"
        - pattern: ^math/rand(/v2)?\.
          msg: "inject a Rand instead of using math/rand directly — it would make a golden unstable"
      analyze-types: true
    misspell:
      # "comando" is Portuguese, not a misspelling of "commando": the comments
      # that use it are quoting section titles of the Portuguese specification
      # vault under docs/ verbatim, and a quote that is silently corrected is
      # no longer a quote.
      ignore-rules:
        - comando
    revive:
      rules:
        - name: context-as-argument
        - name: exported
          disabled: true

  exclusions:
    rules:
      # Tests may call time.Now and build their own clocks.
      - path: _test\.go
        linters: [forbidigo]
      # The HTTP tests go through a helper that registers the close with
      # t.Cleanup, which bodyclose cannot follow. Closing again at the call
      # site would be the change the linter is asking for, and it would be
      # noise around a response that is already closed.
      - path: _test\.go
        linters: [bodyclose]
      # The clock adapter is where time.Now is allowed to exist.
      - path: internal/core/clockx/
        linters: [forbidigo]

formatters:
  enable:
    - gofmt
