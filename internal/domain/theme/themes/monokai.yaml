    surface: "#fdf8ec"
    ink: "#292318"
    accent: "#8b008b"
    contrast: 62
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#d9487c"
      success: "#4fb54b"
      warning: "#f1a948"
      error: "#e54b4b"
