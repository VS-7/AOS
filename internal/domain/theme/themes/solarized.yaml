# Ported from the original's solarized.theme.ts. The palette is the author's; every
# derived token is computed from surface, ink, accent and contrast, the
# way the original's theme provider does it.
id: "solarized"
name: "Solarized"
variants:
  dark:
    surface: "#002b36"
    ink: "#93a1a1"
    accent: "#6c71c4"
    contrast: 88
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#d33682"
      success: "#859900"
      warning: "#b58900"
      error: "#dc322f"
      info: "#2aa198"
      diffAdded: "#4c7654"
      diffRemoved: "#c34b4b"
  light:
    surface: "#fdf6e3"
    ink: "#586e75"
    accent: "#268bd2"
    contrast: 62
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#d33682"
      success: "#859900"
      warning: "#b58900"
      error: "#dc322f"
      info: "#2aa198"
      diffAdded: "#c6dc7a"
      diffRemoved: "#f2a1a1"
