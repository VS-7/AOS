# Ported from the original's one-dark.theme.ts. The palette is the author's; every
# derived token is computed from surface, ink, accent and contrast, the
# way the original's theme provider does it.
id: "one-dark"
name: "One Dark"
variants:
  dark:
    surface: "#282c34"
    ink: "#abb2bf"
    accent: "#61afef"
    contrast: 88
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#56b6c2"
      success: "#98c379"
      warning: "#e5c07b"
      error: "#e06c75"
      info: "#d19a66"
      diffAdded: "#aad482"
      diffRemoved: "#e8828b"
  light:
    surface: "#fafafa"
    ink: "#383a42"
    accent: "#4078f2"
    contrast: 62
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#0184bc"
      success: "#50a14f"
      warning: "#c18401"
      error: "#e45649"
      info: "#986801"
      diffAdded: "#489447"
      diffRemoved: "#d65145"
