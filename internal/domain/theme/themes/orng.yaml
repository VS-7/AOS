# Ported from the original's orng.theme.ts. The palette is the author's; every
# derived token is computed from surface, ink, accent and contrast, the
# way the original's theme provider does it.
id: "orng"
name: "Orng"
variants:
  dark:
    surface: "#0a0a0a"
    ink: "#eeeeee"
    accent: "#EC5B2B"
    contrast: 88
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#FFF7F1"
      success: "#6ba1e6"
      warning: "#EC5B2B"
      error: "#e06c75"
      info: "#56b6c2"
  light:
    surface: "#ffffff"
    ink: "#1a1a1a"
    accent: "#EC5B2B"
    contrast: 62
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#c94d24"
      success: "#0062d1"
      warning: "#EC5B2B"
      error: "#d1383d"
      info: "#318795"
