# Ported from the original's gruvbox.theme.ts. The palette is the author's; every
# derived token is computed from surface, ink, accent and contrast, the
# way the original's theme provider does it.
id: "gruvbox"
name: "Gruvbox"
variants:
  dark:
    surface: "#282828"
    ink: "#ebdbb2"
    accent: "#83a598"
    contrast: 88
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#fb4934"
      success: "#b8bb26"
      warning: "#fabd2f"
      error: "#fb4934"
      info: "#d3869b"
      diffAdded: "#b8bb26"
      diffRemoved: "#fb4934"
  light:
    surface: "#fbf1c7"
    ink: "#3c3836"
    accent: "#076678"
    contrast: 62
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#9d0006"
      success: "#79740e"
      warning: "#b57614"
      error: "#9d0006"
      info: "#8f3f71"
      diffAdded: "#79740e"
      diffRemoved: "#9d0006"
