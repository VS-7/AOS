# Ported from the original's nightowl.theme.ts. The palette is the author's; every
# derived token is computed from surface, ink, accent and contrast, the
# way the original's theme provider does it.
id: "nightowl"
name: "Night Owl"
variants:
  dark:
    surface: "#011627"
    ink: "#d6deeb"
    accent: "#82aaff"
    contrast: 88
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#f78c6c"
      success: "#c5e478"
      warning: "#ecc48d"
      error: "#ef5350"
      info: "#82aaff"
      diffAdded: "#c5e478"
      diffRemoved: "#ef5350"
  light:
    surface: "#f0f0f0"
    ink: "#403f53"
    accent: "#4876d6"
    contrast: 62
    radius: "lg"
    windows: "blur"
    semantic:
      accent: "#aa0982"
      success: "#2aa298"
      warning: "#c96765"
      error: "#de3d3b"
      info: "#4876d6"
      diffAdded: "#2aa298"
      diffRemoved: "#de3d3b"
