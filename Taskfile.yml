version: '3'

# common/darwin/windows/linux come from `wails3 generate build-assets` (see
# build/config.yml). They expect a project-root main package and a `bin`
# output dir, neither of which fits this module's cmd/aos-desktop + dist/
# layout — see the "build"/"run"/"dev" tasks below for how that's bridged,
# rather than patched into the generated files themselves.
includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  # Reproducible by default: a release is built with SOURCE_DATE_EPOCH
  # pinned to the commit's own timestamp (docs/08 - Entrega/Build e
  # Cross-Compile.md's own example), so DATE has to come from there when
  # it's set rather than from wall-clock time — otherwise two builds of the
  # same commit, minutes apart, would embed two different dates and never
  # hash-match. `date -r` is macOS/BSD's "from epoch"; `date -d @epoch` is
  # GNU's. Falls back to wall-clock only for an ordinary local `task build`.
  DATE:
    sh: |
      if [ -n "$SOURCE_DATE_EPOCH" ]; then
        date -u -r "$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$SOURCE_DATE_EPOCH" +%Y-%m-%dT%H:%M:%SZ
      else
        date -u +%Y-%m-%dT%H:%M:%SZ
      fi
  LDFLAGS: >-
    -s -w
    -X github.com/OWNER/aos/internal/core/build.Version={{.VERSION}}
    -X github.com/OWNER/aos/internal/core/build.Commit={{.COMMIT}}
    -X github.com/OWNER/aos/internal/core/build.Date={{.DATE}}
  # Six platform combinations. "Build e Cross-Compile" tabulates five;
  # windows/arm64 is the sixth, and Go supports it with CGO_ENABLED=0.
  TARGETS: darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64
  # The binaries that exist. aos-desktop joins in phase 7.
  BINARIES: aos aosd
  # Read by the included common/darwin/windows/linux Taskfiles: where the
  # desktop binary they wrap (into a .app/.exe/.dev.app) is expected to be,
  # and what to call it. Matches build:desktop's own -o path exactly, so
  # `run` finds what `build` produced.
  APP_NAME: aos-desktop
  BIN_DIR: dist
  # wails3 dev sets WAILS_VITE_PORT when it drives this; plain `npm run dev`
  # falls back to the same port vite.config.ts already defaults to.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5327}}'
  # The generated common/Taskfile.yml's install/build/dev-frontend tasks all
  # branch on this to pick a package manager (npm/yarn/pnpm/bun) and never
  # default it themselves — left unset, `{{.PACKAGE_MANAGER}}` renders empty
  # and every one of those tasks fails looking up e.g.
  # "install:frontend:deps:" (trailing colon, no manager suffix). AOS only
  # ever uses npm (see build:desktop above).
  PACKAGE_MANAGER: npm

# Global rather than declared on run/dev below: a task's own `env:` only
# reaches shell commands that task runs directly, not a `task: X` call to
# another task — and both run and dev only ever call into darwin/windows/
# linux's generated `run`, which is what actually execs the app binary. This
# needs to be visible there, so it has to be global.
env:
  AOS_DAEMON_PATH: "{{.ROOT_DIR}}/dist/aosd"

tasks:
  default:
    cmds: [task: check]

  gen:
    desc: Regenerate everything derived from source
    cmds:
      - task: gen-catalog
      - task: gen-tokens
      - task: gen-schema
      - task: gen-components
      - task: gen-skill

  gen-catalog:
    desc: Rebuild the error catalog from the apperr.New calls in the tree
    cmds:
      - go run ./tools/gencatalog
      - gofmt -w internal/core/apperr/catalog.gen.go

  gen-tokens:
    desc: Rebuild the theme token contract from the CSS the frontend reads
    cmds:
      - go run ./tools/gentokens

  gen-schema:
    desc: Rebuild the TypeScript types from the Go command registry
    cmds:
      - go run ./tools/genschema

  gen-components:
    desc: Rebuild the component catalog the view domain validates against
    dir: frontend
    # The only generator that runs from TypeScript to Go: what a zod schema
    # declares is not readable as text, so it has to be evaluated. See the
    # script's own comment.
    cmds: [npx tsx scripts/gen-components.mjs]

  gen-skill:
    desc: Rebuild pkg/skill/SKILL.md and references/*.md from the command registry
    cmds: [go run ./tools/genskill]

  vet:
    cmds: [go vet ./...]

  lint:
    desc: Run golangci-lint when it is installed
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run
        else
          echo "golangci-lint not installed; skipping (install: https://golangci-lint.run)" >&2
        fi

  test:
    cmds: [go test -race ./...]

  cover:
    desc: Per-package coverage, enforcing the floor each package must clear
    cmds:
      - go test -count=1 -cover ./... | go run ./tools/covercheck

  arch:
    desc: The hexagonal dependency rule
    cmds: [go test ./internal/architecture/...]

  graph:
    desc: Validate the specification vault
    cmds: [node "docs/_scripts/validate-graph.mjs"]

  check:
    desc: Every gate that must be green to close a phase
    cmds:
      - task: gen
      - git diff --exit-code -- internal/core/apperr/catalog.gen.go
      - git diff --exit-code -- internal/domain/view/components.json
      - git diff --exit-code -- pkg/skill/
      - task: vet
      - task: lint
      - task: test
      - task: cover
      - task: arch
      - task: graph

  frontend:
    desc: Build the single-page application
    dir: frontend
    # task-12 (round 2): `vite build`'s default V8 heap ceiling isn't enough
    # for this tree (16953+ modules, dozens of Shiki/Monaco language chunks)
    # — a bare `task build:desktop` OOMs (exit 134) inside this step on a
    # shell that hasn't separately exported NODE_OPTIONS. Setting it here,
    # scoped to this task, is what makes the *documented* command
    # (`task build:desktop`, no env setup required) actually succeed —
    # relying on the caller's shell already having it exported made the
    # gate pass only by accident of environment, never for real.
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    cmds:
      # task-12: root pins zod ^3.25.76 (satisfies @ai-sdk/gateway's
      # `^3.25.76 || ^4.1.8`), but @json-render/shadcn peer-depends on
      # zod ^4.0.0 — a plain `npm ci`/`npm install` hits ERESOLVE on a
      # fresh install every time, deterministically (confirmed: ci ac4540b
      # already had to install @json-render itself with --legacy-peer-deps
      # for the same reason). Without this flag, `build:desktop` cannot get
      # past this step on a clean checkout or CI cache miss.
      - npm ci --legacy-peer-deps --silent || npm install --legacy-peer-deps --silent
      - npx tsc --noEmit
      - npx vite build

  build:desktop:
    desc: Build the desktop application for this platform
    deps: [frontend]
    cmds:
      # The embed pattern cannot reach outside cmd/aos-desktop, so the bundle
      # is copied in first. The copy is generated and ignored by Git.
      #
      # Source maps are deliberately left behind. vite.config.ts emits them
      # because a stack trace from a user's machine is unreadable without
      # one, and its comment says they cost disk and nothing at runtime —
      # true when a server hands out the bundle, false here: main.go embeds
      # this directory with `all:dist`, so every .map would be compiled into
      # the binary every user downloads. They are 135 MB against the
      # bundle's 54, which would put the desktop build at 199 MB — against
      # the 578 MB Electron figure ADR-0002 is argued on. The maps stay in
      # frontend/dist, where symbolication can still reach them.
      #
      # The bundle is replaced wholesale, but .gitkeep survives: it is the one
      # versioned file in there (see its own comment — `//go:embed all:dist`
      # is a compile error when the pattern matches nothing), and an `rm -rf`
      # on the directory would leave every build with a deletion to explain in
      # `git status`.
      #
      # `git clean` rather than find: go-task runs commands through its own
      # shell, whose built-in find has neither -delete nor -mindepth, so the
      # obvious spelling worked everywhere except the platform that needed it.
      # This says the same thing in fewer moving parts — remove what Git does
      # not track — and .gitkeep is tracked, which is the whole point.
      - mkdir -p cmd/aos-desktop/dist
      - git clean -xdfq cmd/aos-desktop/dist
      #
      # tar rather than rsync: rsync is not on a Windows runner, and this task
      # has to produce the same bundle on all three platforms. The pipe also
      # copies the tree in one pass instead of forking once per file, which
      # this bundle's 1686 of them make worth caring about.
      - cd frontend/dist && tar cf - --exclude='*.map' . | (cd ../../cmd/aos-desktop/dist && tar xf -)
      # CGO on macOS and Linux, where Wails links Cocoa and GTK. Windows
      # reaches WebView2 through go-winloader and needs no C toolchain, which
      # is why it is the one platform this builds with cgo off.
      - CGO_ENABLED={{if eq OS "windows"}}0{{else}}1{{end}} go build -trimpath -ldflags="{{.LDFLAGS}}" -o dist/aos-desktop{{if eq OS "windows"}}.exe{{end}} ./cmd/aos-desktop

  # EXT is empty everywhere but Windows, where a binary without it is not one.
  # `go build -o <name>` writes exactly <name> and appends nothing, so the
  # extension has to be asked for — build:all already does this, and packaging
  # on Windows needs the two tasks below to agree with it.
  build:cli:
    desc: Build aos and aosd for this platform
    vars:
      EXT: '{{if eq OS "windows"}}.exe{{end}}'
    cmds:
      - for: {var: BINARIES}
        cmd: CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o dist/{{.ITEM}}{{.EXT}} ./cmd/{{.ITEM}}

  # "build"/"run"/"dev" below are the names `wails3 dev`/`wails3 build` call
  # by convention (see build/config.yml's dev_mode.executes and
  # https://v3.wails.io/guides/build/customization). `build` delegates to the
  # existing build:desktop rather than the generated darwin/windows/linux
  # `build` tasks, which assume `go build` from the project root — this
  # module's main package is cmd/aos-desktop, and build:desktop already
  # handles that (plus the frontend/dist -> cmd/aos-desktop/dist copy the
  # go:embed directive needs). `run` and `dev` are the generated ones
  # unmodified: they only need the binary at {{.BIN_DIR}}/{{.APP_NAME}},
  # which build:desktop already produces.
  build:
    desc: Build the desktop application (wails3 dev/build entry point)
    cmds:
      - task: build:desktop
      # aos-desktop doesn't embed the daemon (ADR-0002); it supervises a
      # separate aosd process, resolved beside its own executable or via
      # AOS_DAEMON_PATH (internal/adapters/supervise.Resolver.Resolve) —
      # neither of which build:desktop alone satisfies.
      - task: build:cli

  # Packaging goes through here for the same reason `build` above does: the
  # generated darwin:package runs `go build` from the project root, and this
  # module's main package is cmd/aos-desktop. Only create:app:bundle is
  # reused — it assembles and signs, and builds nothing.
  #
  # macOS only for now. Windows (NSIS) and Linux (AppImage) reuse the same
  # shape and land next.
  package:desktop:
    desc: Package the desktop application for this platform
    cmds:
      - task: build:desktop
      # For the daemon each packager puts beside the application — see their
      # own comments for why the app is useless without it.
      - task: build:cli
      - task: "package:desktop:{{OS}}"

  package:desktop:darwin:
    desc: Assemble the macOS .app from binaries already built
    cmds:
      - task: darwin:create:app:bundle

  # Not darwin:package / windows:package / linux:package, for the reason
  # `build` above gives: the generated packaging tasks all depend on a
  # generated `build` that runs `go build` from the project root, and this
  # module's main package is cmd/aos-desktop. Only the assembly is reused.
  package:desktop:windows:
    desc: Assemble the Windows installer from binaries already built
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/nsis"
      # ARG_AOS_DAEMON_BINARY is ours; project.nsi installs it beside the
      # application. The WAILS_*_BINARY names are the scaffolding's own.
      - cd build/windows/nsis && makensis -DARG_WAILS_AMD64_BINARY="{{.ROOT_DIR}}/dist/aos-desktop.exe" -DARG_AOS_DAEMON_BINARY="{{.ROOT_DIR}}/dist/aosd.exe" project.nsi

  # Public, not internal, and the three are alike on purpose: the release
  # workflow invokes the Linux one on its own so that a linuxdeploy failure
  # costs the AppImage and not the whole release, and go-task refuses to run
  # an internal task from the command line.
  package:desktop:linux:
    desc: Assemble the Linux AppImage from binaries already built
    cmds:
      - task: linux:generate:dotdesktop
      # build.sh assembles the AppDir by hand, which is what lets the daemon
      # in: `wails3 generate appimage` takes one -binary and nothing else.
      # APP_DAEMON is the variable build.sh reads for it.
      - |
        cd build/linux/appimage
        APP_NAME=aos-desktop \
        APP_BINARY="{{.ROOT_DIR}}/dist/aos-desktop" \
        APP_DAEMON="{{.ROOT_DIR}}/dist/aosd" \
        ICON_PATH="{{.ROOT_DIR}}/build/appicon.png" \
        DESKTOP_FILE="{{.ROOT_DIR}}/build/linux/aos-desktop.desktop" \
        ./build.sh

  run:
    desc: Run the desktop application
    cmds:
      - task: "{{OS}}:run"

  dev:
    desc: Run the desktop application in development mode (hot reload)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:all:
    desc: Cross-compile every binary for every supported platform
    cmds:
      - for: {var: TARGETS}
        cmd: |
          set -e
          GOOS={{splitList "/" .ITEM | first}}
          GOARCH={{splitList "/" .ITEM | last}}
          for bin in {{.BINARIES}}; do
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -trimpath \
              -ldflags="{{.LDFLAGS}}" \
              -o dist/{{.ITEM}}/${bin}${ext} ./cmd/${bin}
          done

  build:verify-reproducible:
    desc: "Fase 9: two builds of the same commit, same SOURCE_DATE_EPOCH, must be byte-identical"
    cmds:
      - |
        set -e
        EPOCH=$(git log -1 --format=%ct)
        DATE_ISO=$(date -u -r "$EPOCH" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -d "@$EPOCH" +%Y-%m-%dT%H:%M:%SZ)
        LDFLAGS="-s -w -X github.com/OWNER/aos/internal/core/build.Version={{.VERSION}} -X github.com/OWNER/aos/internal/core/build.Commit={{.COMMIT}} -X github.com/OWNER/aos/internal/core/build.Date=${DATE_ISO}"
        WORK=$(mktemp -d)
        trap 'rm -rf "$WORK"' EXIT
        for bin in {{.BINARIES}}; do
          CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "$WORK/a-${bin}" ./cmd/${bin}
          CGO_ENABLED=0 go build -trimpath -ldflags="$LDFLAGS" -o "$WORK/b-${bin}" ./cmd/${bin}
          if ! cmp -s "$WORK/a-${bin}" "$WORK/b-${bin}"; then
            echo "NOT REPRODUCIBLE: ${bin} (two builds from the same commit differ)" >&2
            exit 1
          fi
          echo "reproducible: ${bin} ($(shasum -a 256 "$WORK/a-${bin}" | cut -d' ' -f1))"
        done

  build:check-size:
    desc: "Fase 9: fail if a release binary exceeds its target size by more than 20% (docs/08 - Entrega/Build e Cross-Compile.md)"
    vars:
      # Targets are 30/45/55 MB; the 20% ceiling the doc's own "Critério de
      # pronto" describes ("falha se ultrapassar o alvo em mais de 20%").
      LIMIT_AOS: 36
      LIMIT_AOSD: 54
      LIMIT_DESKTOP: 66
    cmds:
      - |
        set -e
        check() {
          bin="$1"; limit_mb="$2"
          [ -f "$bin" ] || { echo "missing: $bin (run task build:cli / build:desktop first)" >&2; exit 1; }
          size=$(stat -f%z "$bin" 2>/dev/null || stat -c%s "$bin")
          size_mb=$((size / 1024 / 1024))
          echo "$bin: ${size_mb}MB (limit ${limit_mb}MB)"
          if [ "$size_mb" -gt "$limit_mb" ]; then
            echo "TOO LARGE: $bin is ${size_mb}MB, limit is ${limit_mb}MB" >&2
            exit 1
          fi
        }
        check dist/aos {{.LIMIT_AOS}}
        check dist/aosd {{.LIMIT_AOSD}}
        if [ -f dist/aos-desktop ]; then check dist/aos-desktop {{.LIMIT_DESKTOP}}; fi

  build:check-no-abspath:
    desc: "Fase 9: fail if a release binary embeds this machine's home directory (proves -trimpath actually stripped paths)"
    cmds:
      - |
        set -e
        found=0
        for bin in dist/aos dist/aosd dist/aos-desktop; do
          [ -f "$bin" ] || continue
          if strings "$bin" | grep -q "$HOME"; then
            echo "ABSOLUTE PATH LEAKED into $bin:" >&2
            strings "$bin" | grep "$HOME" | head -5 >&2
            found=1
          fi
        done
        if [ "$found" -eq 1 ]; then exit 1; fi
        echo "no absolute paths found in dist/"

  clean:
    cmds: [rm -rf dist coverage.out]
