version: '3'

# common/darwin/windows/linux come from `wails3 generate build-assets` (see
# build/config.yml). They expect a project-root main package and a `bin`
# output dir, neither of which fits this module's cmd/aos-desktop + dist/
# layout — see the "build"/"run"/"dev" tasks below for how that's bridged,
# rather than patched into the generated files themselves.
includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  DATE:
    sh: date -u +%Y-%m-%dT%H:%M:%SZ
  LDFLAGS: >-
    -s -w
    -X github.com/OWNER/aos/internal/core/build.Version={{.VERSION}}
    -X github.com/OWNER/aos/internal/core/build.Commit={{.COMMIT}}
    -X github.com/OWNER/aos/internal/core/build.Date={{.DATE}}
  # Six platform combinations. "Build e Cross-Compile" tabulates five;
  # windows/arm64 is the sixth, and Go supports it with CGO_ENABLED=0.
  TARGETS: darwin/arm64 darwin/amd64 linux/arm64 linux/amd64 windows/amd64 windows/arm64
  # The binaries that exist. aos-desktop joins in phase 7.
  BINARIES: aos aosd
  # Read by the included common/darwin/windows/linux Taskfiles: where the
  # desktop binary they wrap (into a .app/.exe/.dev.app) is expected to be,
  # and what to call it. Matches build:desktop's own -o path exactly, so
  # `run` finds what `build` produced.
  APP_NAME: aos-desktop
  BIN_DIR: dist
  # wails3 dev sets WAILS_VITE_PORT when it drives this; plain `npm run dev`
  # falls back to the same port vite.config.ts already defaults to.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5327}}'
  # The generated common/Taskfile.yml's install/build/dev-frontend tasks all
  # branch on this to pick a package manager (npm/yarn/pnpm/bun) and never
  # default it themselves — left unset, `{{.PACKAGE_MANAGER}}` renders empty
  # and every one of those tasks fails looking up e.g.
  # "install:frontend:deps:" (trailing colon, no manager suffix). AOS only
  # ever uses npm (see build:desktop above).
  PACKAGE_MANAGER: npm

# Global rather than declared on run/dev below: a task's own `env:` only
# reaches shell commands that task runs directly, not a `task: X` call to
# another task — and both run and dev only ever call into darwin/windows/
# linux's generated `run`, which is what actually execs the app binary. This
# needs to be visible there, so it has to be global.
env:
  AOS_DAEMON_PATH: "{{.ROOT_DIR}}/dist/aosd"

tasks:
  default:
    cmds: [task: check]

  gen:
    desc: Regenerate everything derived from source
    cmds:
      - task: gen-catalog
      - task: gen-tokens
      - task: gen-schema

  gen-catalog:
    desc: Rebuild the error catalog from the apperr.New calls in the tree
    cmds:
      - go run ./tools/gencatalog
      - gofmt -w internal/core/apperr/catalog.gen.go

  gen-tokens:
    desc: Rebuild the theme token contract from the CSS the frontend reads
    cmds:
      - go run ./tools/gentokens

  gen-schema:
    desc: Rebuild the TypeScript types from the Go command registry
    cmds:
      - go run ./tools/genschema

  vet:
    cmds: [go vet ./...]

  lint:
    desc: Run golangci-lint when it is installed
    cmds:
      - |
        if command -v golangci-lint >/dev/null 2>&1; then
          golangci-lint run
        else
          echo "golangci-lint not installed; skipping (install: https://golangci-lint.run)" >&2
        fi

  test:
    cmds: [go test -race ./...]

  cover:
    desc: Per-package coverage, enforcing the floor each package must clear
    cmds:
      - go test -count=1 -cover ./... | go run ./tools/covercheck

  arch:
    desc: The hexagonal dependency rule
    cmds: [go test ./internal/architecture/...]

  graph:
    desc: Validate the specification vault
    cmds: [node "docs/_scripts/validate-graph.mjs"]

  check:
    desc: Every gate that must be green to close a phase
    cmds:
      - task: gen
      - git diff --exit-code -- internal/core/apperr/catalog.gen.go
      - task: vet
      - task: lint
      - task: test
      - task: cover
      - task: arch
      - task: graph

  frontend:
    desc: Build the single-page application
    dir: frontend
    cmds:
      - npm ci --silent || npm install --silent
      - npx tsc --noEmit
      - npx vite build

  build:desktop:
    desc: Build the desktop application for this platform
    deps: [frontend]
    cmds:
      # The embed pattern cannot reach outside cmd/aos-desktop, so the bundle
      # is copied in first. The copy is generated and ignored by Git.
      - rm -rf cmd/aos-desktop/dist
      - mkdir -p cmd/aos-desktop/dist
      - cp -R frontend/dist/. cmd/aos-desktop/dist/
      - CGO_ENABLED=1 go build -trimpath -ldflags="{{.LDFLAGS}}" -o dist/aos-desktop ./cmd/aos-desktop

  build:cli:
    desc: Build aos and aosd for this platform
    cmds:
      - for: {var: BINARIES}
        cmd: CGO_ENABLED=0 go build -trimpath -ldflags="{{.LDFLAGS}}" -o dist/{{.ITEM}} ./cmd/{{.ITEM}}

  # "build"/"run"/"dev" below are the names `wails3 dev`/`wails3 build` call
  # by convention (see build/config.yml's dev_mode.executes and
  # https://v3.wails.io/guides/build/customization). `build` delegates to the
  # existing build:desktop rather than the generated darwin/windows/linux
  # `build` tasks, which assume `go build` from the project root — this
  # module's main package is cmd/aos-desktop, and build:desktop already
  # handles that (plus the frontend/dist -> cmd/aos-desktop/dist copy the
  # go:embed directive needs). `run` and `dev` are the generated ones
  # unmodified: they only need the binary at {{.BIN_DIR}}/{{.APP_NAME}},
  # which build:desktop already produces.
  build:
    desc: Build the desktop application (wails3 dev/build entry point)
    cmds:
      - task: build:desktop
      # aos-desktop doesn't embed the daemon (ADR-0002); it supervises a
      # separate aosd process, resolved beside its own executable or via
      # AOS_DAEMON_PATH (internal/adapters/supervise.Resolver.Resolve) —
      # neither of which build:desktop alone satisfies.
      - task: build:cli

  run:
    desc: Run the desktop application
    cmds:
      - task: "{{OS}}:run"

  dev:
    desc: Run the desktop application in development mode (hot reload)
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  build:all:
    desc: Cross-compile every binary for every supported platform
    cmds:
      - for: {var: TARGETS}
        cmd: |
          set -e
          GOOS={{splitList "/" .ITEM | first}}
          GOARCH={{splitList "/" .ITEM | last}}
          for bin in {{.BINARIES}}; do
            ext=""
            if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
            GOOS=$GOOS GOARCH=$GOARCH CGO_ENABLED=0 go build -trimpath \
              -ldflags="{{.LDFLAGS}}" \
              -o dist/{{.ITEM}}/${bin}${ext} ./cmd/${bin}
          done

  clean:
    cmds: [rm -rf dist coverage.out]
