<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AOS</title>
    <script>
      /*
       * The stored theme is applied before the first paint. Without this the
       * page renders in the default palette and then switches, and every reload
       * flashes.
       */
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("aos.theme") || "null");
          if (!stored) return;
          var root = document.documentElement;
          var appearance =
            stored.appearance === "auto"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : stored.appearance;
          root.classList.add(appearance);
          if (stored.tokens) {
            for (var token in stored.tokens) {
              root.style.setProperty("--" + token, stored.tokens[token]);
            }
          }
        } catch (e) {
          /* A storage that cannot be read is a page that starts on the default. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
